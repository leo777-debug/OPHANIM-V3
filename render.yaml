services:
  - type: web
    name: ophanim
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    preDeployCommand: 'node db/run-migrations.mjs'
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: ophanim-db, property: connectionString }
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: WATCHLIST_CRON_SECRET
        generateValue: true
      - key: DISRUPTION_SYNC_CRON_SECRET
        generateValue: true
      - key: IMPORT_CRON_SECRET
        generateValue: true
      - key: AI_SANDBOX_RESEARCH_URL
        sync: false
      - key: AI_SANDBOX_RESEARCH_TOKEN
        sync: false
  - type: cron
    name: ophanim-watchlists
    runtime: docker
    schedule: '*/5 * * * *'
    dockerCommand: 'sh -c "curl -fsS -H \"Authorization: Bearer $WATCHLIST_CRON_SECRET\" $APP_URL/api/watchlists/cron"'
    envVars:
      - key: APP_URL
        sync: false
      - key: WATCHLIST_CRON_SECRET
        sync: false
  - type: cron
    name: ophanim-disruption-sync
    runtime: docker
    schedule: '*/10 * * * *'
    dockerCommand: 'sh -c "curl -fsS -H \"Authorization: Bearer $DISRUPTION_SYNC_CRON_SECRET\" $APP_URL/api/logistics/disruptions/sync"'
    envVars:
      - key: APP_URL
        sync: false
      - key: DISRUPTION_SYNC_CRON_SECRET
        sync: false
  - type: cron
    name: ophanim-imports
    runtime: docker
    schedule: '* * * * *'
    dockerCommand: 'sh -c "curl -fsS -H \"Authorization: Bearer $IMPORT_CRON_SECRET\" $APP_URL/api/imports/cron"'
    envVars:
      - key: APP_URL
        sync: false
      - key: IMPORT_CRON_SECRET
        sync: false
databases:
  - name: ophanim-db
    plan: basic-256mb
