name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/lib/platform src/lib/imports/format-detection.ts src/lib/imports/generic-entity-import.ts src/lib/providers/provider-metrics.ts
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
